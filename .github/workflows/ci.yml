name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test:unit
      - run: pnpm build


  database:
    # Migrations and the content seed, on the same Postgres + pgvector as production
    # (Supabase has pgvector too). Seeded twice to prove it is safe to repeat.
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: fieldtested
          POSTGRES_PASSWORD: fieldtested_dev
          POSTGRES_DB: fieldtested_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fieldtested" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://fieldtested:fieldtested_dev@localhost:5432/fieldtested_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/seed.mjs --test-reset
      - run: node scripts/seed.mjs
