name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test:unit
      - run: pnpm build

  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: fieldtested
          POSTGRES_PASSWORD: fieldtested_dev
          POSTGRES_DB: fieldtested_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fieldtested" --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - name: Tests (files storage)
        run: cargo test
        env:
          STORAGE: files
      - name: Tests (Postgres storage)
        run: cargo test
        env:
          TEST_DATABASE_URL: postgres://fieldtested:fieldtested_dev@localhost:5432/fieldtested_test
