# Temporary local database for development. Swap DATABASE_URL for a hosted
# Postgres later; nothing in the code depends on this container.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: field-tested-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fieldtested
      POSTGRES_PASSWORD: fieldtested_dev
      POSTGRES_DB: fieldtested
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldtested -d fieldtested"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
